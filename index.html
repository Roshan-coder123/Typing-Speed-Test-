<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Typing Test</title>

  <!-- fonts: nunito for ui, special elite for that typewriter vibe -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Special+Elite&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <h1>Typing Test</h1>
    <div class="top-text">A small project I made to test speed + accuracy.</div>

    <div class="card">
      <!-- timer mode picker -->
      <div class="row">
        <button class="mode-btn" data-time="15">15 sec</button>
        <button class="mode-btn" data-time="30">30 sec</button>
        <button class="mode-btn active" data-time="60">60 sec</button>
        <button class="mode-btn" data-time="120">120 sec</button>
      </div>

      <!-- live stats -->
      <div class="stats">
        <div class="stat">
          <div class="num" id="liveWpm">0</div>
          <div class="label">WPM</div>
        </div>
        <div class="stat">
          <div class="num" id="liveAcc">--</div>
          <div class="label">Accuracy</div>
        </div>
        <div class="stat">
          <div class="num" id="liveTime">60</div>
          <div class="label">Time Left</div>
        </div>
        <div class="stat">
          <div class="num" id="liveMistakes">0</div>
          <div class="label">Mistakes</div>
        </div>
      </div>

      <div class="bar">
        <div class="bar-inner" id="timeBar"></div>
      </div>

      <div class="text-box" id="quoteBox"></div>

      <!-- hidden input so mobile keyboards still pop up -->
      <input id="hiddenInput" type="text" autocomplete="off" spellcheck="false">

      <div class="small-note" id="helperText">Click the text area and start typing. Backspace works too.</div>

      <div class="controls">
        <button class="action primary" id="restart">Restart</button>
        <button class="action secondary" id="newText">Change Text</button>
      </div>
    </div>
  </div>

  <!-- result popup -->
  <div class="popup" id="resultPopup">
    <div class="popup-card">
      <h2>Finished</h2>
      <div class="big-score" id="finalWpm">0</div>
      <div class="result-mini">words per minute</div>

      <div id="finalMessage" class="final-msg"></div>

      <div class="result-grid">
        <div class="mini">
          <strong id="finalAcc">--</strong>
          <span>Accuracy</span>
        </div>
        <div class="mini">
          <strong id="finalMistakes">0</strong>
          <span>Mistakes</span>
        </div>
        <div class="mini">
          <strong id="finalChars">0</strong>
          <span>Typed</span>
        </div>
        <div class="mini">
          <strong id="finalDuration">60s</strong>
          <span>Duration</span>
        </div>
      </div>

      <button class="action primary full-w" id="playAgain">Try Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
