<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starlight Type Lab</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Trebuchet MS", sans-serif;
      background: #08111f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow: hidden;
      background: #08111f;
    }
    
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: text;
    }
  </style>
</head>
<body>
  <canvas id="typeLab" aria-label="Starlight Type Lab typing game"></canvas>
  <script src="script.js"></script>
</body>
</html>
