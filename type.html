<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typing Speed Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f5f0e8;
      font-family: 'Nunito', sans-serif;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #2c2c2c;                                                                                      
      margin-bottom: 4px;            
    }

    .subtitle {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 32px;
    }

    .main-box {
      background: #fff;
      border-radius: 12px;
      padding: 28px 28px 24px;
      width: 100%;
      max-width: 700px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }

    /* Time mode buttons */
    .time-options {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .time-options span {
      font-size: 0.8rem;
      color: #aaa;
      align-self: center;
      margin-right: 4px;
    }

    .time-btn {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1.5px solid #ddd;
      background: transparent;
      color: #777;
      font-family: 'Nunito', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .time-btn:hover {
      border-color: #e07b39;
      color: #e07b39;
    }

    .time-btn.active {
      background: #e07b39;
      border-color: #e07b39;
      color: white;
      font-weight: 700;
    }

    /* Timer bar */
    .timer-track {
      height: 4px;
      background: #eee;
      border-radius: 4px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .timer-fill {
      height: 100%;
      background: #e07b39;
      border-radius: 4px;
      width: 100%;
      transition: width 1s linear;
    }

    /* Text display */
    .text-area {
      font-family: 'Courier Prime', monospace;
      font-size: 1.1rem;
      line-height: 2;
      color: #bbb;
      min-height: 100px;
      margin-bottom: 18px;
      user-select: none;
      word-break: break-word;
      cursor: text;
    }

    .text-area .ch {
      position: relative;
    }

    .text-area .ch.correct {
      color: #333;
    }

    .text-area .ch.wrong {
      color: #e74c3c;
      background: #fdecea;
      border-radius: 2px;
    }

    .text-area .ch.active::after {
      content: '';
      position: absolute;
      left: 0;
      top: 4px;
      bottom: 4px;
      width: 2px;
      background: #e07b39;
      border-radius: 2px;
      animation: blink 0.9s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Hidden input trick */
    #ghost {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 1px;
      height: 1px;
    }

    /* Stats row */
    .stats-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .stat-box {
      flex: 1;
      min-width: 80px;
      background: #faf8f4;
      border: 1.5px solid #eee;
      border-radius: 10px;
      padding: 12px 10px;
      text-align: center;
    }

    .stat-num {
      font-size: 1.6rem;
      font-weight: 700;
      color: #2c2c2c;
      font-family: 'Courier Prime', monospace;
    }

    .stat-name {
      font-size: 0.7rem;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    /* Hint text */
    .hint {
      font-size: 0.78rem;
      color: #bbb;
      text-align: center;
      margin-bottom: 16px;
      transition: opacity 0.3s;
    }

    .hint.gone { opacity: 0; }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn {
      padding: 9px 22px;
      border-radius: 8px;
      border: none;
      font-family: 'Nunito', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.97); }

    .btn-orange {
      background: #e07b39;
      color: white;
    }

    .btn-gray {
      background: #eee;
      color: #555;
    }

    /* Result modal */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .overlay.show {
      display: flex;
    }

    .result-card {
      background: white;
      border-radius: 14px;
      padding: 36px 32px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      animation: popIn 0.3s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .result-card h2 {
      font-size: 1rem;
      color: #aaa;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .big-wpm {
      font-family: 'Courier Prime', monospace;
      font-size: 4.5rem;
      font-weight: 700;
      color: #e07b39;
      line-height: 1;
    }

    .wpm-label {
      font-size: 0.8rem;
      color: #bbb;
      margin-bottom: 20px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }

    .rg-item {
      background: #faf8f4;
      border-radius: 8px;
      padding: 12px 8px;
    }

    .rg-val {
      font-family: 'Courier Prime', monospace;
      font-size: 1.4rem;
      font-weight: 700;
      color: #333;
    }

    .rg-label {
      font-size: 0.65rem;
      color: #bbb;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .grade-text {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 20px;
    }

    .grade-text b { color: #e07b39; }

    .result-card .btn { width: 100%; }
  </style>
</head>
<body>

  <h1>Typing Speed Test</h1>
  <p class="subtitle">How fast can you type? Let's find out.</p>

  <div class="main-box">

    <!-- Time selector -->
    <div class="time-options">
      <span>Time:</span>
      <button class="time-btn" data-t="15">15s</button>
      <button class="time-btn" data-t="30">30s</button>
      <button class="time-btn active" data-t="60">60s</button>
      <button class="time-btn" data-t="120">120s</button>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-num" id="sWpm">0</div>
        <div class="stat-name">WPM</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="sAcc">—</div>
        <div class="stat-name">Accuracy</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="sTime">60</div>
        <div class="stat-name">Seconds</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="sErr">0</div>
        <div class="stat-name">Errors</div>
      </div>
    </div>

    <!-- Timer bar -->
    <div class="timer-track">
      <div class="timer-fill" id="timerFill"></div>
    </div>

    <!-- Text display -->
    <div class="text-area" id="textArea"></div>
    <input id="ghost" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />

    <!-- Hint -->
    <p class="hint" id="hint">Click on the text above, or just start typing!</p>

    <!-- Buttons -->
    <div class="btn-row">
      <button class="btn btn-orange" id="restartBtn">Restart</button>
      <button class="btn btn-gray" id="newBtn">New Words</button>
    </div>

  </div>

  <!-- Results -->
  <div class="overlay" id="overlay">
    <div class="result-card">
      <h2>Your result</h2>
      <div class="big-wpm" id="rWpm">0</div>
      <div class="wpm-label">words per minute</div>
      <p class="grade-text" id="rGrade"></p>
      <div class="result-grid">
        <div class="rg-item">
          <div class="rg-val" id="rAcc">—</div>
          <div class="rg-label">Accuracy</div>
        </div>
        <div class="rg-item">
          <div class="rg-val" id="rErr">0</div>
          <div class="rg-label">Errors</div>
        </div>
        <div class="rg-item">
          <div class="rg-val" id="rChars">0</div>
          <div class="rg-label">Chars typed</div>
        </div>
        <div class="rg-item">
          <div class="rg-val" id="rTime">60s</div>
          <div class="rg-label">Duration</div>
        </div>
      </div>
      <button class="btn btn-orange" id="retryBtn">Try Again</button>
    </div>
  </div>

  <script>
    const WORDS = [
      "the","be","to","of","and","a","in","that","have","it","for","not","on","with",
      "as","you","do","at","this","but","by","from","they","we","say","she","or","an",
      "will","my","one","all","would","there","their","what","so","up","out","if","about",
      "who","get","which","go","me","when","make","can","like","time","no","just","know",
      "take","people","into","year","your","good","some","could","them","see","other",
      "than","then","now","look","only","come","its","over","think","also","back","after",
      "use","how","our","work","first","well","way","even","new","want","because","any",
      "give","day","most","great","need","large","often","turn","here","ask","read","land",
      "home","move","try","kind","play","air","away","animal","house","point","page","still",
      "learn","should","world","while","last","next","seem","together","change","found"
    ];

    // State
    let timeLimit = 60;
    let timeLeft  = 60;
    let timer     = null;
    let started   = false;
    let done      = false;
    let chars     = [];   // array of expected characters
    let pos       = 0;    // current cursor position
    let errors    = 0;
    let typed     = 0;

    // DOM refs
    const textArea   = document.getElementById('textArea');
    const ghost      = document.getElementById('ghost');
    const hint       = document.getElementById('hint');
    const overlay    = document.getElementById('overlay');
    const timerFill  = document.getElementById('timerFill');

    const sWpm  = document.getElementById('sWpm');
    const sAcc  = document.getElementById('sAcc');
    const sTime = document.getElementById('sTime');
    const sErr  = document.getElementById('sErr');

    const rWpm   = document.getElementById('rWpm');
    const rAcc   = document.getElementById('rAcc');
    const rErr   = document.getElementById('rErr');
    const rChars = document.getElementById('rChars');
    const rTime  = document.getElementById('rTime');
    const rGrade = document.getElementById('rGrade');

    // --- Helpers ---
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function makeText() {
      return shuffle(WORDS).slice(0, 80).join(' ');
    }

    function wpm() {
      const mins = (timeLimit - timeLeft) / 60;
      if (mins <= 0) return 0;
      return Math.max(0, Math.round(((typed - errors) / 5) / mins));
    }

    function acc() {
      if (typed === 0) return '—';
      return Math.max(0, Math.round(((typed - errors) / typed) * 100)) + '%';
    }

    function updateStats() {
      sWpm.textContent  = wpm();
      sAcc.textContent  = acc();
      sErr.textContent  = errors;
    }

    // --- Build display ---
    function buildDisplay(text) {
      chars = text.split('');
      pos   = 0;
      errors= 0;
      typed = 0;

      textArea.innerHTML = chars.map((c, i) =>
        `<span class="ch" data-i="${i}">${c === ' ' ? '&nbsp;' : c}</span>`
      ).join('');

      span(0).classList.add('active');
    }

    function span(i) {
      return textArea.querySelector(`[data-i="${i}"]`);
    }

    // --- Timer ---
    function startTimer() {
      timer = setInterval(() => {
        timeLeft--;
        sTime.textContent = timeLeft;
        timerFill.style.width = (timeLeft / timeLimit * 100) + '%';
        updateStats();
        if (timeLeft <= 0) finish();
      }, 1000);
    }

    // --- Finish ---
    function finish() {
      clearInterval(timer);
      done = true;
      ghost.blur();

      const w = wpm();
      const a = acc();

      rWpm.textContent   = w;
      rAcc.textContent   = a;
      rErr.textContent   = errors;
      rChars.textContent = typed;
      rTime.textContent  = timeLimit + 's';

      let msg;
      if      (w >= 100) msg = '<b>Incredible!</b> You\'re a speed demon. 🔥';
      else if (w >= 70)  msg = '<b>Excellent!</b> Way above average. ⚡';
      else if (w >= 50)  msg = '<b>Good job!</b> Better than most people. 👍';
      else if (w >= 30)  msg = '<b>Not bad!</b> Keep practicing! 🙂';
      else               msg = '<b>Keep going!</b> Practice makes perfect. 💪';

      rGrade.innerHTML = msg;
      overlay.classList.add('show');
    }

    // --- Reset ---
    function reset() {
      clearInterval(timer);
      started = false;
      done    = false;
      timeLeft = timeLimit;

      sTime.textContent = timeLimit;
      sWpm.textContent  = '0';
      sAcc.textContent  = '—';
      sErr.textContent  = '0';
      timerFill.style.transition = 'none';
      timerFill.style.width = '100%';
      setTimeout(() => { timerFill.style.transition = 'width 1s linear'; }, 50);

      ghost.value = '';
      overlay.classList.remove('show');
      hint.classList.remove('gone');

      buildDisplay(makeText());
    }

    // --- Input ---
    // Focus ghost when clicking on text area
    textArea.addEventListener('click', () => ghost.focus());

    // Also allow starting by pressing any key on the page
    document.addEventListener('keydown', (e) => {
      if (done) return;
      if (e.key === 'Tab') { e.preventDefault(); reset(); return; }
      if (!started && e.key.length === 1) ghost.focus();
    });

    ghost.addEventListener('focus', () => {
      // no-op, just keeping focus
    });

    ghost.addEventListener('keydown', (e) => {
      if (done) return;

      // Tab restarts
      if (e.key === 'Tab') { e.preventDefault(); reset(); return; }

      // Start timer on first real keystroke
      if (!started && e.key.length === 1) {
        started = true;
        hint.classList.add('gone');
        startTimer();
      }

      if (e.key === 'Backspace') {
        e.preventDefault();
        if (pos > 0) {
          const prev = span(pos);
          if (prev) prev.classList.remove('active');
          pos--;
          const cur = span(pos);
          cur.classList.remove('correct', 'wrong');
          cur.classList.add('active');
        }
        ghost.value = '';
        return;
      }
    });

    ghost.addEventListener('input', () => {
      if (done || !started) return;

      const val = ghost.value;
      if (!val) return;
      const ch = val[val.length - 1];
      ghost.value = '';

      if (pos >= chars.length) return;

      const cur = span(pos);
      cur.classList.remove('active');

      if (ch === chars[pos]) {
        cur.classList.add('correct');
      } else {
        cur.classList.add('wrong');
        errors++;
      }

      typed++;
      pos++;

      if (pos >= chars.length) {
        // ran out — load fresh text silently
        buildDisplay(makeText());
      } else {
        const next = span(pos);
        next.classList.add('active');
        next.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }

      updateStats();
    });

    // Enter key after done = retry
    document.addEventListener('keydown', (e) => {
      if (done && e.key === 'Enter') reset();
    });

    // Time buttons
    document.querySelectorAll('.time-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        timeLimit = parseInt(btn.dataset.t);
        reset();
      });
    });

    document.getElementById('restartBtn').addEventListener('click', reset);
    document.getElementById('newBtn').addEventListener('click', reset);
    document.getElementById('retryBtn').addEventListener('click', reset);

    // Init
    reset();
  </script>
</body>
</html>
